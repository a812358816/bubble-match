<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
	<title>Color Bubble Match</title>
	<style>
		html, body, #canvas {
			margin: 0;
			padding: 0;
			border: 0;
		}

		body {
			background-color: #1a1a2e;
			overflow: hidden;
			touch-action: none;
			font-family: 'Segoe UI', 'PingFang SC', 'Noto Sans', Arial, sans-serif;
		}

		#canvas {
			display: block;
			position: absolute;
			top: 0;
			left: 0;
		}

		#canvas:focus {
			outline: none;
		}

		/* Loading overlay */
		#status {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			z-index: 100;
			transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
			visibility: visible;
			opacity: 1;
		}

		#status.hidden {
			opacity: 0;
			visibility: hidden;
			pointer-events: none;
		}

		/* Bubbles container */
		.bubbles {
			position: relative;
			width: 200px;
			height: 80px;
			margin-bottom: 24px;
		}

		.bubble {
			position: absolute;
			bottom: 0;
			border-radius: 50%;
			animation: float 1.8s ease-in-out infinite;
		}

		.bubble:nth-child(1) {
			left: 20px;
			width: 28px;
			height: 28px;
			background: radial-gradient(circle at 35% 35%, #ff6b9d, #c0392b);
			animation-delay: 0s;
		}

		.bubble:nth-child(2) {
			left: 56px;
			width: 34px;
			height: 34px;
			background: radial-gradient(circle at 35% 35%, #74b9ff, #2980b9);
			animation-delay: 0.25s;
		}

		.bubble:nth-child(3) {
			left: 96px;
			width: 30px;
			height: 30px;
			background: radial-gradient(circle at 35% 35%, #ffeaa7, #f39c12);
			animation-delay: 0.5s;
		}

		.bubble:nth-child(4) {
			left: 132px;
			width: 26px;
			height: 26px;
			background: radial-gradient(circle at 35% 35%, #a29bfe, #6c5ce7);
			animation-delay: 0.75s;
		}

		.bubble:nth-child(5) {
			left: 160px;
			width: 32px;
			height: 32px;
			background: radial-gradient(circle at 35% 35%, #ff6b9d, #c0392b);
			animation-delay: 1.0s;
		}

		@keyframes float {
			0%, 100% {
				transform: translateY(0) scale(1);
				opacity: 0.9;
			}
			30% {
				transform: translateY(-36px) scale(1.15);
				opacity: 1;
			}
			60% {
				transform: translateY(-18px) scale(1.05);
				opacity: 0.85;
			}
		}

		/* Title */
		.title {
			color: #fff;
			font-size: 26px;
			font-weight: 700;
			letter-spacing: 1px;
			margin-bottom: 8px;
			text-shadow: 0 2px 8px rgba(0,0,0,0.4);
		}

		.subtitle {
			color: rgba(255,255,255,0.5);
			font-size: 13px;
			font-weight: 400;
			margin-bottom: 28px;
			letter-spacing: 0.5px;
		}

		/* Progress bar */
		.progress-track {
			width: 220px;
			height: 4px;
			background: rgba(255,255,255,0.12);
			border-radius: 2px;
			overflow: hidden;
		}

		.progress-fill {
			width: 0%;
			height: 100%;
			background: linear-gradient(90deg, #ff6b9d, #74b9ff, #a29bfe);
			background-size: 200% 100%;
			border-radius: 2px;
			animation: shimmer 1.5s ease-in-out infinite;
			transition: width 0.3s ease-out;
		}

		@keyframes shimmer {
			0%, 100% { background-position: 0% 50%; }
			50% { background-position: 100% 50%; }
		}

		/* Error notice */
		#status-notice {
			display: none;
			background-color: #5b3943;
			border-radius: 8px;
			border: 1px solid #9b3943;
			color: #e0e0e0;
			font-size: 13px;
			line-height: 1.4;
			margin: 20px 2rem 0;
			padding: 12px 16px;
			text-align: center;
			max-width: 320px;
		}
	</style>
<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head>
<body>
	<canvas id="canvas">
		Your browser does not support the canvas tag.
	</canvas>

	<noscript>
		Your browser does not support JavaScript.
	</noscript>

	<div id="status">
		<div class="bubbles">
			<div class="bubble"></div>
			<div class="bubble"></div>
			<div class="bubble"></div>
			<div class="bubble"></div>
			<div class="bubble"></div>
		</div>
		<div class="title">Color Bubble Match</div>
		<div class="subtitle">Loading...</div>
		<div class="progress-track">
			<div class="progress-fill" id="progress-fill"></div>
		</div>
		<div id="status-notice"></div>
	</div>

	<script src="index.js"></script>
	<script>
	const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":116232,"index.wasm":37686550},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
	const GODOT_THREADS_ENABLED = false;
	const engine = new Engine(GODOT_CONFIG);

	(function () {
		const statusOverlay = document.getElementById('status');
		const progressFill = document.getElementById('progress-fill');
		const subtitle = document.querySelector('.subtitle');
		const statusNotice = document.getElementById('status-notice');

		let initializing = true;
		let statusMode = '';

		function setStatusMode(mode) {
			if (statusMode === mode || !initializing) {
				return;
			}
			if (mode === 'hidden') {
				statusOverlay.classList.add('hidden');
				initializing = false;
				return;
			}
			statusOverlay.style.visibility = 'visible';
			statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
			statusMode = mode;
		}

		function setStatusNotice(text) {
			while (statusNotice.lastChild) {
				statusNotice.removeChild(statusNotice.lastChild);
			}
			const lines = text.split('\n');
			lines.forEach((line) => {
				statusNotice.appendChild(document.createTextNode(line));
				statusNotice.appendChild(document.createElement('br'));
			});
			statusNotice.style.display = 'block';
		}

		function displayFailureNotice(err) {
			console.error(err);
			if (err instanceof Error) {
				setStatusNotice(err.message);
			} else if (typeof err === 'string') {
				setStatusNotice(err);
			} else {
				setStatusNotice('An unknown error occurred.');
			}
			setStatusMode('notice');
			initializing = false;
			subtitle.textContent = 'Failed to load';
		}

		function updateProgress(current, total) {
			if (current > 0 && total > 0) {
				const pct = Math.round((current / total) * 100);
				progressFill.style.width = pct + '%';
				if (pct < 100) {
					subtitle.textContent = 'Loading... ' + pct + '%';
				} else {
					subtitle.textContent = 'Starting...';
				}
			}
		}

		const missing = Engine.getMissingFeatures({
			threads: GODOT_THREADS_ENABLED,
		});

		if (missing.length !== 0) {
			if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
				let serviceWorkerRegistrationPromise;
				try {
					serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
				} catch (err) {
					serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
				}
				Promise.race([
					serviceWorkerRegistrationPromise.then((registration) => {
						if (registration != null) {
							return Promise.reject(new Error('Service worker already exists.'));
						}
						return registration;
					}).then(() => engine.installServiceWorker()),
					new Promise((resolve) => {
						setTimeout(() => resolve(), 2000);
					}),
				]).then(() => {
					window.location.reload();
				}).catch((err) => {
					console.error('Error while registering service worker:', err);
				});
			} else {
				const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
				displayFailureNotice(missingMsg + missing.join('\n'));
			}
		} else {
			setStatusMode('progress');
			engine.startGame({
				'onProgress': function (current, total) {
					updateProgress(current, total);
				},
			}).then(() => {
				setStatusMode('hidden');
			}, displayFailureNotice);
		}
	}());
	</script>
</body>
</html>
